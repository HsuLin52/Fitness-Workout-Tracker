<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercise Details</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

    <div th:replace="~{fragments/header :: header}"></div>

    <main>

        <h2>Exercise Details</h2>

        <p>
            <strong>ID:</strong>
            <span th:text="${exercise.id}"></span>
        </p>

        <p>
            <strong>Name:</strong>
            <span th:text="${exercise.name}"></span>
        </p>

        <p>
            <strong>Type:</strong>
            <span th:text="${exercise.type}"></span>
        </p>

        <p>
            <strong>Calories per Minute:</strong>
            <span th:text="${exercise.caloriesPerMinute}"></span>
        </p>

        <div class="form-actions">

            <a th:href="@{/exercises/edit/{id}(id=${exercise.id})}"
               class="btn btn-edit">
                Edit
            </a>

            <a th:href="@{/exercises}"
               class="btn btn-cancel">
                Back to Exercise List
            </a>

        </div>

    </main>

    <div th:replace="~{fragments/footer :: footer}"></div>

</body>
</html>
