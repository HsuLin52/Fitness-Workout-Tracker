<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercise List</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

    <div th:replace="~{fragments/header :: header}"></div>

    <main>

        <h2>Exercise Catalogue</h2>

        <form th:action="@{/exercises}" method="get">

            <label for="keyword">Search by name:</label>
            <input
                    type="text"
                    id="keyword"
                    name="keyword"
                    th:value="${keyword}"
                    placeholder="Enter exercise name"
            >

            <label for="type">Exercise type:</label>
            <select id="type" name="type">
                <option value="">All types</option>

                <option
                        th:each="exerciseType : ${exerciseTypes}"
                        th:value="${exerciseType}"
                        th:text="${exerciseType}"
                        th:selected="${exerciseType == selectedType}">
                </option>
            </select>

            <div class="form-actions">

                <button type="submit" class="btn btn-search">
                    Search
                </button>

                <a th:href="@{/exercises}" class="btn btn-edit">
                    Clear
                </a>

            </div>
        </form>

        <br>

        <a th:href="@{/exercises/add}" class="btn btn-add">
            Add Exercise
        </a>

        <br><br>

        <p th:if="${#lists.isEmpty(exercises)}">
            No exercises found.
        </p>

        <table
                th:unless="${#lists.isEmpty(exercises)}"
                border="1"
                cellpadding="8">

            <thead>
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Type</th>
                <th>Calories per Minute</th>
                <th>Actions</th>
            </tr>
            </thead>

            <tbody>
            <tr th:each="exercise : ${exercises}">
                <td th:text="${exercise.id}"></td>
                <td th:text="${exercise.name}"></td>
                <td th:text="${exercise.type}"></td>
                <td th:text="${exercise.caloriesPerMinute}"></td>

                <td class="actions">

                    <a th:href="@{/exercises/{id}(id=${exercise.id})}"
                       class="btn btn-view">
                        View
                    </a>

                    <a th:href="@{/exercises/edit/{id}(id=${exercise.id})}"
                       class="btn btn-edit">
                        Edit
                    </a>

                    <a th:href="@{/exercises/delete/{id}(id=${exercise.id})}"
                       class="btn btn-delete"
                       onclick="return confirm('Are you sure you want to delete this exercise?')">
                        Delete
                    </a>

                </td>
            </tr>
            </tbody>

        </table>

    </main>

    <div th:replace="~{fragments/footer :: footer}"></div>

</body>
</html>
