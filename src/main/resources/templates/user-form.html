<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Add User</title>

    <link rel="stylesheet"
          th:href="@{/css/style.css}">
</head>

<body>

<div th:replace="~{fragments/header :: header}"></div>

<main>

    <h2>Add New User</h2>

    <p>
        Create a user who can be selected when making
        workout plans or recording completed workouts.
    </p>

    <form th:action="@{/users/add}"
          th:object="${user}"
          method="post">

        <div>
            <label for="name">Full Name:</label>

            <input type="text"
                   id="name"
                   th:field="*{name}"
                   maxlength="100"
                   placeholder="Enter the user's full name"
                   autocomplete="name">

            <p class="form-error"
               th:if="${#fields.hasErrors('name')}"
               th:errors="*{name}">
            </p>
        </div>

        <div>
            <label for="email">Email Address:</label>

            <input type="email"
                   id="email"
                   th:field="*{email}"
                   placeholder="example@email.com"
                   autocomplete="email">

            <p class="form-error"
               th:if="${#fields.hasErrors('email')}"
               th:errors="*{email}">
            </p>
        </div>

        <div class="form-actions">

            <button type="submit"
                    class="btn btn-save">
                Save User
            </button>

            <a th:href="@{/users}"
               class="btn btn-cancel">
                Cancel
            </a>

        </div>

    </form>

</main>

<div th:replace="~{fragments/footer :: footer}"></div>

</body>
</html>
