<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8">
  <title>Completed Workouts</title>
  <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

<div th:replace="~{fragments/header :: header}"></div>

<main>

  <h2>Completed Workouts</h2>

  <br>

  <a th:href="@{/workouts/add}" class="btn btn-add">
    Record Workout
  </a>

  <br><br>

  <p th:if="${#lists.isEmpty(workouts)}">
    No completed workouts found.
  </p>

  <table
          th:unless="${#lists.isEmpty(workouts)}"
          border="1"
          cellpadding="8">

    <thead>
    <tr>
      <th>Date</th>
      <th>Exercise</th>
      <th>Duration (min)</th>
      <th>Calories</th>
      <th>Actions</th>
    </tr>
    </thead>

    <tbody>

    <tr th:each="workout : ${workouts}">

      <td th:text="${workout.workoutDate}"></td>

      <td th:text="${workout.exercise.name}"></td>

      <td th:text="${workout.duration}"></td>

      <td th:text="${workout.calories}"></td>

      <td class="actions">

        <a th:href="@{/workouts/{id}(id=${workout.id})}"
           class="btn btn-view">
          View
        </a>

        <a th:href="@{/workouts/edit/{id}(id=${workout.id})}"
           class="btn btn-edit">
          Edit
        </a>

        <form th:action="@{/workouts/delete/{id}(id=${workout.id})}"
              method="post"
              style="display:inline;"
              onsubmit="return confirm('Are you sure you want to delete this completed workout?')">
          <button type="submit" class="btn btn-delete">Delete</button>
        </form>

      </td>

    </tr>

    </tbody>

  </table>

</main>

<div th:replace="~{fragments/footer :: footer}"></div>

</body>
</html>
